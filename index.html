<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Anex Chat</title>
<meta name="description" content="Anex, an AI chat assistant.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: slim conversation rail on the left, one reading column on the right, composer pinned below.
   To re-skin the whole site, change the tokens in this block. */
:root{
  --bg:#F3F6F7;
  --panel:#FFFFFF;
  --side:#E8EEF0;
  --ink:#13222B;
  --muted:#586A74;
  --line:#D6DFE3;
  --accent:#0B7A85;
  --accent-ink:#FFFFFF;
  --user:#DAEAED;
  --code:#0F1A20;
  --code-ink:#DCE8EC;
  --danger:#B42318;
  --font-display:'Bricolage Grotesque','Inter',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1317;--panel:#121B21;--side:#0F171C;--ink:#E5EDF0;--muted:#8CA0AB;--line:#22313A;
    --accent:#4CC2CC;--accent-ink:#06191C;--user:#17313A;--code:#070D10;--code-ink:#D5E3E8;--danger:#F97066;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1317;--panel:#121B21;--side:#0F171C;--ink:#E5EDF0;--muted:#8CA0AB;--line:#22313A;
  --accent:#4CC2CC;--accent-ink:#06191C;--user:#17313A;--code:#070D10;--code-ink:#D5E3E8;--danger:#F97066;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}

.app{height:100%;display:grid;grid-template-columns:276px minmax(0,1fr)}

/* Sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:16px var(--gr) 12px var(--gl);gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-0.01em;padding:4px 0}
.mark{width:28px;height:28px;color:var(--accent);flex:none}
.btn-new{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:500;text-align:left}
.btn-new:hover{border-color:var(--accent)}
.chat-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -6px;padding:0 6px}
.list-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 6px 2px}
.chat-item{display:flex;align-items:center;gap:4px;border-radius:8px}
.chat-item.on{background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.chat-item:hover{background:var(--panel)}
.chat-open{flex:1;min-width:0;text-align:left;background:none;border:0;padding:8px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:8px}
.chat-del{flex:none;background:none;border:0;color:var(--muted);padding:6px 8px;border-radius:8px;font-size:12px;opacity:0}
.chat-item:hover .chat-del,.chat-item:focus-within .chat-del,.chat-del.armed{opacity:1}
.chat-del.armed{color:var(--danger);font-weight:600}
.side-foot{display:flex;gap:8px;padding-top:8px;border-top:1px solid var(--line)}
.ghost{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:8px 10px;border-radius:8px;color:var(--muted)}
.ghost:hover{background:var(--panel);color:var(--ink)}

/* Main */
.main{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;min-height:0;background:var(--bg)}
.top{display:flex;align-items:center;gap:8px;padding:10px var(--gr) 10px var(--gl);border-bottom:1px solid var(--line);min-width:0}
.top h1{flex:1;min-width:0;margin:0;font-family:var(--font-display);font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:0;background:none;color:var(--muted)}
.icon-btn:hover{background:var(--panel);color:var(--ink)}
.menu-btn{display:none}
.scroll{overflow-y:auto;min-height:0;padding:0 var(--gr) 0 var(--gl);overscroll-behavior:contain}
.thread{max-width:760px;margin:0 auto;padding:24px 0 12px;display:flex;flex-direction:column;gap:22px;min-height:100%}

.empty{margin:auto;text-align:center;padding:24px 0;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .mark{width:48px;height:48px}
.empty h2{font-family:var(--font-display);font-size:clamp(26px,5vw,36px);line-height:1.15;margin:6px 0 0;letter-spacing:-0.02em;text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:44ch;text-wrap:balance}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px;width:100%;max-width:560px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;min-width:0;line-height:1.4}
.chip:hover{border-color:var(--accent)}
.chip b{display:block;font-weight:600;margin-bottom:2px}
.chip span{color:var(--muted);font-size:13px}

.msg{display:flex;gap:12px;min-width:0}
.msg.user{justify-content:flex-end}
.bubble{max-width:min(85%,560px);background:var(--user);padding:10px 14px;border-radius:16px 16px 4px 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.avatar{flex:none;width:28px;height:28px;color:var(--accent);margin-top:2px}
.body{flex:1;min-width:0}
.md{overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}
.md>*:last-child{margin-bottom:0}
.md p{margin:0 0 .8em}
.md h2,.md h3,.md h4,.md h5{font-family:var(--font-display);line-height:1.25;margin:1.2em 0 .4em;letter-spacing:-0.01em}
.md h2{font-size:1.35em}.md h3{font-size:1.2em}.md h4,.md h5{font-size:1.05em}
.md ul,.md ol{margin:0 0 .8em;padding-left:1.4em}
.md li{margin:.2em 0}
.md blockquote{margin:0 0 .8em;padding:.1em 0 .1em 14px;border-left:3px solid var(--line);color:var(--muted)}
.md a{color:var(--accent)}
.md hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.md code{font-family:var(--font-mono);font-size:.88em;background:var(--side);padding:.12em .4em;border-radius:5px}
.code{margin:0 0 .9em;border-radius:12px;overflow:hidden;background:var(--code);color:var(--code-ink)}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;font-family:var(--font-mono);font-size:12px;color:#8FA3AD;border-bottom:1px solid #1E2D35}
.code-head button{background:none;border:0;color:#B7C8D0;padding:4px 8px;border-radius:6px;font-size:12px}
.code-head button:hover{background:#1A2830}
.code pre{margin:0;padding:12px 14px;overflow-x:auto}
.code code{background:none;padding:0;font-size:13px;line-height:1.55;color:inherit}
.tbl{overflow-x:auto;margin:0 0 .9em}
.md table{border-collapse:collapse;font-size:.93em}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.md th{background:var(--side)}

.actions{display:flex;gap:2px;margin-top:6px;margin-left:-8px}
.act{background:none;border:0;color:var(--muted);padding:4px 8px;border-radius:8px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.act:hover{background:var(--panel);color:var(--ink)}
.note{color:var(--muted);font-size:13px;margin-top:6px}
.err{display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:var(--danger);font-size:14px;margin-top:6px}
.err button{background:none;border:1px solid currentColor;border-radius:8px;padding:3px 10px;color:inherit;font-size:13px}
.think{display:inline-flex;gap:5px;padding:8px 0;color:var(--muted);align-items:center;font-size:14px}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}}

/* Composer */
.composer{padding:8px var(--gr) 14px var(--gl)}
.composer-in{max-width:760px;margin:0 auto}
.notice{max-width:760px;margin:0 auto 8px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:13px}
.box{display:flex;align-items:flex-end;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px}
.box:focus-within{border-color:var(--accent)}
.box textarea{flex:1;min-width:0;border:0;background:none;resize:none;outline:none;max-height:200px;padding:7px 0;line-height:1.5}
.box textarea::placeholder{color:var(--muted)}
.send{flex:none;width:38px;height:38px;border-radius:11px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.send:disabled{opacity:.35;cursor:default}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}

/* Settings */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px var(--gr) 16px var(--gl);background:rgba(8,14,18,.55)}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:520px;max-height:100%;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.sheet h2{margin:0;font-family:var(--font-display);font-size:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:13px}
.field small{color:var(--muted)}
.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.field textarea{min-height:120px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:500}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.scrim{position:fixed;inset:0;z-index:15;background:rgba(8,14,18,.5)}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:20;left:0;top:0;bottom:0;width:min(300px,86vw);transform:translateX(-102%);transition:transform .2s ease;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .app.nav-open .side{transform:none}
  .menu-btn{display:inline-grid}
  .chips{grid-template-columns:minmax(0,1fr)}
  .chat-del{opacity:1}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>

</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Conversations">
    <div class="brand"><span id="brandMark"></span><span id="brandName">Anex</span></div>
    <button class="btn-new" id="newChat" type="button"><span id="icPlus"></span>New chat</button>
    <div class="list-label">Recent</div>
    <nav class="chat-list" id="chatList"></nav>
    <div class="side-foot">
      <button class="ghost" id="openSettings" type="button"><span id="icGear"></span>Settings</button>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main">
    <header class="top">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open conversations"></button>
      <h1 id="chatTitle">New chat</h1>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch light or dark theme"></button>
    </header>

    <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>

    <form class="composer" id="form" autocomplete="off">
      <div class="notice" id="notice" hidden>Demo mode: no chatbot is connected yet, so replies are placeholders. Set <code>endpoint</code> in the CONFIG block at the top of the script to your chatbot's URL.</div>
      <div class="composer-in">
        <div class="box">
          <textarea id="input" rows="1" placeholder="Message Anex" aria-label="Message"></textarea>
          <button class="send" id="sendBtn" type="submit" aria-label="Send message"></button>
        </div>
        <div class="hint">Enter to send, Shift+Enter for a new line</div>
      </div>
    </form>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <h2 id="setTitle">Settings</h2>
    <div class="field">
      <label for="setPersona">How the assistant should behave</label>
      <textarea id="setPersona"></textarea>
      <small>Applies to every new reply. Describe tone, role or rules in plain words.</small>
    </div>
    <div class="field">
      <label for="setTier">Reply speed</label>
      <select id="setTier">
        <option value="quick">Fast (short, snappy answers)</option>
        <option value="default">Balanced</option>
        <option value="complex">Thorough (slower, deeper reasoning)</option>
      </select>
    </div>
    <div class="field">
      <label for="setTheme">Theme</label>
      <select id="setTheme">
        <option value="system">Match my device</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>
    <div class="row">
      <button class="btn danger" id="clearAll" type="button">Delete all chats</button>
      <button class="btn pri" id="closeSettings" type="button">Done</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   EDIT HERE: the things most people want to change.
   ============================================================ */
   const CONFIG = {
  name: "Anex",
  inputPlaceholder: "Message Anex",
  greeting: "What can I help with?",
  tagline: "Ask a question, draft something, or think a problem through.",
  persona: "You are Anex, a friendly, concise assistant. Answer directly first, then add detail only if it helps. Use short paragraphs, and use lists or code blocks only when they make the answer easier to use. If you are unsure, say so.",

  // This is the clean, corrected Botpress URL path for your custom template
  endpoint: "https://chat.botpress.cloud/api/v1/bots/e05c3883-cf35-4530-9927-3d3b8ec0c447/converse",


  // Extra headers to send, for example { "X-Site-Token": "public-token" } (must not be a secret).
  endpointHeaders: {},

  // Reply speed when running inside Claude: "quick", "default" or "complex"
  modelTier: "default",
  // How many recent messages are sent back with each question
  maxMessagesKept: 24,
  // The four starter cards on an empty chat: [title, hint, message sent]
  suggestions: [
    ["Plan my week", "Turn a messy to-do list into a schedule", "Help me plan my week. Ask me for my tasks and deadlines, then build a realistic schedule."],
    ["Explain something", "Plain-language explainers on any topic", "Explain how vaccines train the immune system, in plain language with one everyday analogy."],
    ["Write an email", "Polite, clear, ready to send", "Help me write a short, polite email asking my landlord to fix a leaking tap. Ask me what details you need."],
    ["Debug my code", "Paste an error and get the likely cause", "I will paste an error message and some code. Help me find the likely cause and the smallest fix."]
  ]
};
/* ============================================================ */

const ICON = {
  mark:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="16" cy="16" r="11"/><circle cx="16" cy="16" r="3.6" fill="currentColor" stroke="none"/><path d="M16 1.5v4M16 26.5v4M1.5 16h4M26.5 16h4" opacity=".55"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  gear:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  menu:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  sun:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  send:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  stop:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>',
  copy:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
  redo:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>'
};

/* ---------- state ---------- */
const KEY = "anex.chat.v1";
const $ = (id) => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 10);

function defaults(){
  return { chats: [], activeId: null, settings: { persona: CONFIG.persona, tier: CONFIG.modelTier, theme: "system" } };
}
function loadState(){
  const base = defaults();
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && Array.isArray(s.chats)){
        base.chats = s.chats.filter(c => c && Array.isArray(c.msgs));
        base.activeId = s.activeId || null;
        base.settings = Object.assign(base.settings, s.settings || {});
      }
    }
  }catch(e){}
  return base;
}
let state = loadState();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

let busy = false, ctl = null, sample = null, sampleChecked = false;
let streamEl = null;

function active(){
  let c = state.chats.find(x => x.id === state.activeId);
  if(!c){ c = newChat(true); }
  return c;
}
function newChat(silent){
  const reuse = state.chats.find(c => c.msgs.length === 0);
  if(reuse){ state.activeId = reuse.id; if(!silent){ save(); renderAll(); } return reuse; }
  const c = { id: uid(), title: "New chat", msgs: [], ts: Date.now() };
  state.chats.unshift(c);
  state.activeId = c.id;
  if(!silent){ save(); renderAll(); }
  return c;
}

/* ---------- markdown (small, safe: everything is escaped first) ---------- */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(s){
  return s
    .replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\s][^*\n]*?)\*(?!\*)/g,"$1<em>$2</em>")
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)"']+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
function inl(s){
  return s.split(/(`[^`\n]+`)/g).map((p,i) => i % 2 ? "<code>" + esc(p.slice(1,-1)) + "</code>" : fmt(esc(p))).join("");
}
const BLOCK = /^```|^#{1,4}\s|^\s*[-*+]\s+|^\s*\d+[.)]\s+|^>\s?|^\s*(---|\*\*\*)\s*$/;
const SEP = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/;
function cells(l){ return l.trim().replace(/^\||\|$/g,"").split("|").map(c => c.trim()); }
function md(src){
  const L = src.replace(/\r/g,"").split("\n");
  const out = [];
  let i = 0;
  while(i < L.length){
    const l = L[i];
    const f = l.match(/^```\s*([\w+-]*)/);
    if(f){
      const code = []; i++;
      while(i < L.length && !/^```/.test(L[i])){ code.push(L[i]); i++; }
      i++;
      out.push('<div class="code"><div class="code-head"><span>' + esc(f[1] || "code") + '</span><button type="button" class="copy-code">Copy</button></div><pre><code>' + esc(code.join("\n")) + "</code></pre></div>");
      continue;
    }
    const h = l.match(/^(#{1,4})\s+(.*)$/);
    if(h){ const n = h[1].length + 1; out.push("<h" + n + ">" + inl(h[2]) + "</h" + n + ">"); i++; continue; }
    if(/^\s*(---|\*\*\*)\s*$/.test(l)){ out.push("<hr>"); i++; continue; }
    if(/^\s*[-*+]\s+/.test(l)){
      const items = [];
      while(i < L.length && /^\s*[-*+]\s+/.test(L[i])){ items.push("<li>" + inl(L[i].replace(/^\s*[-*+]\s+/,"")) + "</li>"); i++; }
      out.push("<ul>" + items.join("") + "</ul>"); continue;
    }
    if(/^\s*\d+[.)]\s+/.test(l)){
      const items = [];
      while(i < L.length && /^\s*\d+[.)]\s+/.test(L[i])){ items.push("<li>" + inl(L[i].replace(/^\s*\d+[.)]\s+/,"")) + "</li>"); i++; }
      out.push("<ol>" + items.join("") + "</ol>"); continue;
    }
    if(/^>\s?/.test(l)){
      const q = [];
      while(i < L.length && /^>\s?/.test(L[i])){ q.push(inl(L[i].replace(/^>\s?/,""))); i++; }
      out.push("<blockquote>" + q.join("<br>") + "</blockquote>"); continue;
    }
    if(l.includes("|") && i + 1 < L.length && SEP.test(L[i+1])){
      const head = cells(l); i += 2;
      const rows = [];
      while(i < L.length && L[i].includes("|") && L[i].trim()){ rows.push(cells(L[i])); i++; }
      out.push('<div class="tbl"><table><thead><tr>' + head.map(c => "<th>" + inl(c) + "</th>").join("") + "</tr></thead><tbody>" +
        rows.map(r => "<tr>" + r.map(c => "<td>" + inl(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>");
      continue;
    }
    if(!l.trim()){ i++; continue; }
    const p = [];
    while(i < L.length && L[i].trim() && !BLOCK.test(L[i]) && !(L[i].includes("|") && i + 1 < L.length && SEP.test(L[i+1]))){ p.push(inl(L[i])); i++; }
    out.push("<p>" + p.join("<br>") + "</p>");
  }
  return out.join("");
}

/* ---------- rendering ---------- */
function renderSide(){
  const list = $("chatList");
  list.textContent = "";
  const chats = state.chats.filter(c => c.msgs.length || c.id === state.activeId).sort((a,b) => b.ts - a.ts);
  for(const c of chats){
    const row = document.createElement("div");
    row.className = "chat-item" + (c.id === state.activeId ? " on" : "");
    const open = document.createElement("button");
    open.type = "button"; open.className = "chat-open"; open.textContent = c.title; open.dataset.id = c.id; open.dataset.act = "open";
    const del = document.createElement("button");
    del.type = "button"; del.className = "chat-del"; del.textContent = "Delete"; del.dataset.id = c.id; del.dataset.act = "del";
    del.setAttribute("aria-label", "Delete chat " + c.title);
    row.append(open, del);
    list.append(row);
  }
}

function msgHTML(m, i, isLast){
  if(m.role === "user"){
    const d = document.createElement("article");
    d.className = "msg user";
    const b = document.createElement("div"); b.className = "bubble"; b.textContent = m.content;
    d.append(b);
    return d;
  }
  const d = document.createElement("article");
  d.className = "msg assistant"; d.dataset.i = i;
  d.innerHTML = '<div class="avatar">' + ICON.mark + '</div><div class="body"><div class="md">' + md(m.content) + "</div>" +
    (m.stopped ? '<div class="note">Stopped.</div>' : "") +
    (m.cut ? '<div class="note">This answer was cut short. Ask it to continue.</div>' : "") +
    '<div class="actions"><button class="act" type="button" data-act="copy">' + ICON.copy + 'Copy</button>' +
    (isLast ? '<button class="act" type="button" data-act="regen">' + ICON.redo + "Regenerate</button>" : "") + "</div></div>";
  return d;
}

function renderThread(){
  const c = active();
  const t = $("thread");
  t.textContent = "";
  streamEl = null;
  $("chatTitle").textContent = c.msgs.length ? c.title : CONFIG.name;
  if(!c.msgs.length){
    const e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = '<div class="mark">' + ICON.mark + "</div><h2></h2><p></p><div class=\"chips\"></div>";
    e.querySelector("h2").textContent = CONFIG.greeting;
    e.querySelector("p").textContent = CONFIG.tagline;
    const chips = e.querySelector(".chips");
    CONFIG.suggestions.forEach(s => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip";
      b.innerHTML = "<b></b><span></span>";
      b.querySelector("b").textContent = s[0];
      b.querySelector("span").textContent = s[1];
      b.addEventListener("click", () => send(s[2]));
      chips.append(b);
    });
    t.append(e);
    return;
  }
  c.msgs.forEach((m, i) => t.append(msgHTML(m, i, i === c.msgs.length - 1 && !busy)));
  scrollDown(true);
}

function renderAll(){
  renderSide(); renderThread(); setComposer();
}

function nearBottom(){
  const s = $("scroll");
  return s.scrollHeight - s.scrollTop - s.clientHeight < 120;
}
function scrollDown(force){
  const s = $("scroll");
  if(force || nearBottom()) s.scrollTop = s.scrollHeight;
}

function setComposer(){
  const btn = $("sendBtn");
  btn.innerHTML = busy ? ICON.stop : ICON.send;
  btn.setAttribute("aria-label", busy ? "Stop reply" : "Send message");
  btn.disabled = !busy && !$("input").value.trim();
}

/* ---------- Claude ---------- */
const sampleReady = (async () => {
  try{ sample = (await (window.claude && window.claude.use ? window.claude.use("sample") : null)) || null; }catch(e){ sample = null; }
  sampleChecked = true;
  $("notice").hidden = !!CONFIG.endpoint || !!sample;
})();

/* One function decides where replies come from:
   1) your chatbot endpoint, 2) Claude when the page runs inside Claude, 3) a demo reply. */
async function generate(turns, o){
  if(CONFIG.endpoint) return callEndpoint(turns, o);
  await sampleReady;
  if(sample){
    return sample(turns, { cache: false, signal: o.signal, modelTier: state.settings.tier, onText: o.onText });
  }
  return demoReply(turns, o);
}

async function callEndpoint(turns, o){
  const system = turns[0].content;
  const messages = turns.slice(1);
  let res;
  try{
    res = await fetch(CONFIG.endpoint, {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" }, CONFIG.endpointHeaders || {}),
      body: JSON.stringify({ text: turns[turns.length - 1].content }),
      signal: o.signal
    });
  }catch(e){
    throw { code: o.signal.aborted ? "cancelled" : "upstream_error" };
  }
  if(!res.ok) throw { code: "upstream_error" };
  const type = res.headers.get("content-type") || "";
  if(type.includes("application/json")){
    let d;
    try{ d = await res.json(); }catch(e){ throw { code: "upstream_error" }; }
    const t = d.reply ?? d.text ?? d.message ?? d.output ??
      (d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) ??
      (d.content && d.content[0] && d.content[0].text) ?? "";
    if(typeof t !== "string" || !t.trim()) throw { code: "empty_completion" };
    o.onText({ text: t });
    return { text: t, truncated: false };
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let text = "";
  try{
    for(;;){
      const r = await reader.read();
      if(r.done) break;
      text += dec.decode(r.value, { stream: true });
      o.onText({ text: text });
    }
  }catch(e){
    throw { code: o.signal.aborted ? "cancelled" : "upstream_error", text: text.trim() ? text : undefined };
  }
  if(!text.trim()) throw { code: "empty_completion" };
  return { text: text, truncated: false };
}

async function demoReply(turns, o){
  const last = turns[turns.length - 1].content.replace(/\s+/g, " ").slice(0, 80);
  const full = "**Anex is in demo mode.** No chatbot is connected yet, so this is a placeholder reply to: “" + last + "”.\n\nTo connect yours, set `endpoint` in the `CONFIG` block at the top of the script to your chatbot's URL.";
  let text = "";
  for(const w of full.split(/(\s+)/)){
    if(o.signal.aborted) throw { code: "cancelled", text: text.trim() ? text : undefined };
    text += w;
    o.onText({ text: text });
    await new Promise(r => setTimeout(r, 22));
  }
  return { text: text, truncated: false };
}

function titleFrom(t){
  const s = t.replace(/\s+/g," ").trim();
  return s.length > 42 ? s.slice(0,40).trimEnd() + "…" : s;
}
function rules(){
  return state.settings.persona + "\n\nWrite replies in Markdown. Today's date is " + new Date().toDateString() + ".";
}
const ERR = {
  not_granted: "Claude access was declined for this page. Reload and allow it to get replies.",
  sampling_disabled: "Claude is not available for this account.",
  rate_limited: "Too many requests right now. Wait a moment, then try again.",
  session_expired: "Your session expired. Sign in again, then retry.",
  refused: "Claude could not answer that one. Try rewording it.",
  empty_completion: "No answer came back. Try rewording the question.",
  prompt_too_large: "This chat got too long. Start a new chat.",
  upstream_error: "Could not reach the chatbot. Check your connection and try again."
};

async function send(text, opts){
  opts = opts || {};
  if(busy) return;
  const c = active();
  if(!opts.regen){
    text = (text || "").trim();
    if(!text) return;
    c.msgs.push({ role: "user", content: text });
    if(c.title === "New chat") c.title = titleFrom(text);
  }
  c.ts = Date.now();
  save();
  $("input").value = ""; autosize();
  busy = true;
  renderSide(); renderThread(); setComposer();

  const wrap = document.createElement("article");
  wrap.className = "msg assistant";
  wrap.innerHTML = '<div class="avatar">' + ICON.mark + '</div><div class="body"><div class="md"><div class="think"><span class="dots"><i></i><i></i><i></i></span>Thinking</div></div><div class="slot"></div></div>';
  $("thread").append(wrap);
  streamEl = wrap;
  scrollDown(true);

  const mdEl = wrap.querySelector(".md"), slot = wrap.querySelector(".slot");

  ctl = new AbortController();
  const turns = [{ role: "user", content: rules() }]
    .concat(c.msgs.slice(-CONFIG.maxMessagesKept).map(m => ({ role: m.role, content: m.content })));

  try{
    const r = await generate(turns, {
      signal: ctl.signal,
      onText: (u) => { const stick = nearBottom(); mdEl.innerHTML = md(u.text); if(stick) scrollDown(true); }
    });
    c.msgs.push({ role: "assistant", content: r.text, cut: !!r.truncated });
  }catch(e){
    e = e || {};
    if(e.text){
      c.msgs.push({ role: "assistant", content: e.text, stopped: e.code === "cancelled" });
    }else if(e.code === "cancelled"){
      /* stopped before any text: nothing to keep */
    }else{
      mdEl.textContent = "";
      const row = document.createElement("div");
      row.className = "err";
      row.append(document.createTextNode(ERR[e.code] || "Something went wrong while getting the reply."));
      const retry = document.createElement("button");
      retry.type = "button"; retry.textContent = "Try again";
      retry.addEventListener("click", () => send(null, { regen: true }));
      row.append(retry);
      slot.append(row);
      busy = false; ctl = null; streamEl = null; c.ts = Date.now(); save(); renderSide(); setComposer();
      return;
    }
  }
  busy = false; ctl = null; streamEl = null;
  c.ts = Date.now();
  save();
  renderAll();
}

/* ---------- events ---------- */
function autosize(){
  const t = $("input");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 200) + "px";
  setComposer();
}
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", (e) => {
  if(e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); $("form").requestSubmit(); }
});
$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  if(busy){ if(ctl) ctl.abort(); return; }
  send($("input").value);
});

$("newChat").addEventListener("click", () => { if(busy) return; newChat(); closeNav(); $("input").focus(); });

$("chatList").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if(!b) return;
  const id = b.dataset.id;
  if(b.dataset.act === "open"){
    if(busy) return;
    state.activeId = id; save(); renderAll(); closeNav();
  }else if(b.dataset.act === "del"){
    if(busy) return;
    if(!b.classList.contains("armed")){
      b.classList.add("armed"); b.textContent = "Sure?";
      setTimeout(() => { b.classList.remove("armed"); b.textContent = "Delete"; }, 3000);
      return;
    }
    state.chats = state.chats.filter(c => c.id !== id);
    if(state.activeId === id) state.activeId = null;
    save(); active(); renderAll();
  }
});

$("thread").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.classList.contains("copy-code")){
    const txt = b.closest(".code").querySelector("code").textContent;
    copyText(txt, b); return;
  }
  const art = b.closest(".msg");
  if(b.dataset.act === "copy" && art){
    const m = active().msgs[Number(art.dataset.i)];
    if(m) copyText(m.content, b);
  }else if(b.dataset.act === "regen"){
    const c = active();
    if(c.msgs.length && c.msgs[c.msgs.length - 1].role === "assistant"){ c.msgs.pop(); save(); send(null, { regen: true }); }
  }
});
function copyText(t, btn){
  const label = btn.innerHTML;
  const done = () => { btn.textContent = "Copied"; setTimeout(() => { btn.innerHTML = label; }, 1400); };
  const fallback = () => {
    const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.append(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){}
    ta.remove();
  };
  try{ navigator.clipboard.writeText(t).then(done, fallback); }catch(e){ fallback(); }
}

/* nav drawer (phones) */
function openNav(){ $("app").classList.add("nav-open"); $("scrim").hidden = false; }
function closeNav(){ $("app").classList.remove("nav-open"); $("scrim").hidden = true; }
$("menuBtn").addEventListener("click", openNav);
$("scrim").addEventListener("click", closeNav);

/* theme */
function applyTheme(){
  const t = state.settings.theme;
  if(t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  const dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  $("themeBtn").innerHTML = dark ? ICON.sun : ICON.moon;
  $("setTheme").value = t;
}
$("themeBtn").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme === "dark" ||
    (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  state.settings.theme = dark ? "light" : "dark";
  save(); applyTheme();
});
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme); }catch(e){}

/* settings */
function openSettings(){
  $("setPersona").value = state.settings.persona;
  $("setTier").value = state.settings.tier;
  $("setTheme").value = state.settings.theme;
  $("clearAll").textContent = "Delete all chats";
  $("modal").hidden = false;
  $("setPersona").focus();
}
function closeSettings(){ $("modal").hidden = true; }
$("openSettings").addEventListener("click", () => { closeNav(); openSettings(); });
$("closeSettings").addEventListener("click", closeSettings);
$("modal").addEventListener("click", (e) => { if(e.target === $("modal")) closeSettings(); });
document.addEventListener("keydown", (e) => { if(e.key === "Escape"){ closeSettings(); closeNav(); } });
$("setPersona").addEventListener("input", (e) => { state.settings.persona = e.target.value.trim() ? e.target.value : CONFIG.persona; save(); });
$("setTier").addEventListener("change", (e) => { state.settings.tier = e.target.value; save(); });
$("setTheme").addEventListener("change", (e) => { state.settings.theme = e.target.value; save(); applyTheme(); });
let armedClear = false;
$("clearAll").addEventListener("click", () => {
  if(busy) return;
  if(!armedClear){
    armedClear = true; $("clearAll").textContent = "Click again to confirm";
    setTimeout(() => { armedClear = false; $("clearAll").textContent = "Delete all chats"; }, 3000);
    return;
  }
  armedClear = false;
  state.chats = []; state.activeId = null; save(); active(); renderAll(); closeSettings();
});

/* ---------- boot ---------- */
document.title = CONFIG.name + " Chat";
$("brandName").textContent = CONFIG.name;
$("brandMark").innerHTML = '<span class="mark" style="display:block">' + ICON.mark + "</span>";
$("icPlus").innerHTML = ICON.plus;
$("icGear").innerHTML = ICON.gear;
$("menuBtn").innerHTML = ICON.menu;
$("input").placeholder = CONFIG.inputPlaceholder;
applyTheme();
active();
renderAll();
</script>
